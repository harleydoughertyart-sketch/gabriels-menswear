<section data-wf-key="fitting" id="fitting" class="wf-book-fitting sc-section" data-sc-act="flow" data-sc-drift="#eef2f4" aria-labelledby="wf-book-fitting-title">
  <!-- book/fitting: what happens at a fitting, for the man who hesitates before he commits. A three-panel
       fitting mirror drawn in HTML, CSS and one inline SVG tape measure (the home page's "In person, in the
       mirror"; no photo, no video), whose wings swing open once as it enters; three numbered steps that
       rise in order; the price line under the third; one Google review word for word (FACTS.md lines 133
       to 136) in the home page's review card. fitting.css draws the mirror, the quote marks and the stars.
       No script. Light only. -->
  <div class="sc-wrap wf-book-fitting__grid">
    <h2 class="sc-display sc-display--md wf-book-fitting__title" id="wf-book-fitting-title">What happens <em>at your fitting</em>.</h2>

    <figure class="wf-book-fitting__mirror" aria-hidden="true" data-sc-in>
      <span class="wf-book-fitting__panel wf-book-fitting__wing wf-book-fitting__wing--l">
        <svg class="wf-book-fitting__tape" viewBox="0 0 60 117" focusable="false">
          <path class="wf-book-fitting__tape-band" d="M41 -0.6C41 2.2 38.5 3 33 3C17 3 4 13 3.4 29V47" />
          <path class="wf-book-fitting__tape-ticks" d="M41 -0.6C41 2.2 38.5 3 33 3C17 3 4 13 3.4 29V47" />
          <path class="wf-book-fitting__tape-end" d="M-0.8 46.2h8.4v3.2h-8.4z" />
        </svg>
      </span>
      <span class="wf-book-fitting__panel wf-book-fitting__centre"></span>
      <span class="wf-book-fitting__panel wf-book-fitting__wing wf-book-fitting__wing--r"></span>
    </figure>

    <ol class="wf-book-fitting__steps" role="list" data-sc-in data-sc-stagger="90">
      <li class="wf-book-fitting__step"><span class="wf-book-fitting__n" aria-hidden="true">1</span><span class="wf-book-fitting__t">Tell Gabriel the occasion and date.</span></li>
      <li class="wf-book-fitting__step"><span class="wf-book-fitting__n" aria-hidden="true">2</span><span class="wf-book-fitting__t">He checks the fit on you.</span></li>
      <li class="wf-book-fitting__step"><span class="wf-book-fitting__n" aria-hidden="true">3</span><span class="wf-book-fitting__t">See your options before you commit.</span></li>
    </ol>
    <p class="wf-book-fitting__price">Pricing depends on the garment, fabric, and work.</p>

    <figure class="gm-review wf-book-fitting__review">
      <blockquote class="wf-book-fitting__quote">
        <p>These guys know how to get you up to speed and looking sharp…</p>
      </blockquote>
      <figcaption class="wf-book-fitting__by">
        <span class="wf-book-fitting__name">Taylor Blair</span>
        <span class="wf-book-fitting__stars" role="img" aria-label="5 out of 5 stars"></span>
      </figcaption>
    </figure>
  </div>
</section>
