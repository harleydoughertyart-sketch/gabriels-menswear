<section data-wf-key="cost" id="cost" class="wf-prom-cost sc-section" data-sc-act="flow" data-sc-drift="#f7f5f1" data-gm-dark aria-labelledby="wf-prom-cost-title">
  <!-- prom/cost: the page's one navy chapter, a straight answer to "what will it cost?". The site's FAQ
       answer (see FACTS.md) drawn as a sum with nothing to add up: the garment + the fabric + the work.
       The plus signs are drawn in cost.css, never typed, so a screen reader hears the lead and then the
       three tiles as one sentence. The motion: the tiles arrive one after another, each plus with the
       tile it adds, then the own-suit line (the house data-sc-in reveal, once). data-gm-dark lets
       gm-site.js darken the fixed header over this section. Light only. -->
  <div class="sc-wrap wf-prom-cost__inner">
    <h2 class="sc-display sc-display--md wf-prom-cost__title" id="wf-prom-cost-title"><span class="wf-prom-cost__first">Know the cost</span> <em>before you commit</em>.</h2>
    <p class="wf-prom-cost__lead" id="wf-prom-cost-lead">Three things set the price.</p>

    <ul class="wf-prom-cost__tiles" role="list" aria-labelledby="wf-prom-cost-lead" data-sc-in data-sc-stagger="90">
      <li class="wf-prom-cost__tile"><span class="wf-prom-cost__the">The</span> garment</li>
      <li class="wf-prom-cost__tile"><span class="wf-prom-cost__the">The</span> fabric</li>
      <li class="wf-prom-cost__tile"><span class="wf-prom-cost__the">The</span> work</li>
    </ul>

    <div class="wf-prom-cost__own" data-sc-in>
      <p class="wf-prom-cost__line"><span class="wf-prom-cost__ask">Own a suit?</span> Gabriel tells you if altering is worth the money.</p>
      <a class="wf-prom-cost__link" href="/tailoring">See what Gabriel alters</a>
    </div>
  </div>
</section>
